name: Poll DHL Tracking

on:
  schedule:
    # Runs every 2 hours at minute 0
    - cron: '0 */2 * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  poll-tracking:
    runs-on: ubuntu-latest
    
    steps:
      - name: Poll DHL Tracking API
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Verify environment variables
          if [ -z "$APP_URL" ]; then
            echo "❌ NEXT_PUBLIC_APP_URL is not set"
            exit 1
          fi
          
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET is not set"
            exit 1
          fi
          
          echo "🌐 Polling: $APP_URL/api/cron/poll-dhl-tracking"
          echo "⏰ Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          # Make request with error handling
          response=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/poll-dhl-tracking" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            --fail-with-body) || curl_exit_code=$?
          
          # Check if curl failed
          if [ ! -z "$curl_exit_code" ]; then
            echo "❌ Curl failed with exit code: $curl_exit_code"
            echo "Response: $response"
            exit 1
          fi
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "📊 HTTP Status: $http_code"
          echo "📄 Response: $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "❌ Poll failed with status $http_code"
            exit 1
          fi
          
          echo "✅ Poll completed successfully"
      
      - name: Log Completion
        if: success()
        run: echo "✅ DHL tracking poll completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
      
      - name: Log Failure
        if: failure()
        run: echo "❌ DHL tracking poll failed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
